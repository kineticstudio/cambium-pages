<!-- Cambium supply network map. Paste into a Webflow Embed inside the
     map section (dark background, below the Join / Log in heading). -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/kineticstudio/cambium-pages@v1/map/network.css">
<div class="cb-net">
<div class="net-map pre" id="net-map">
      <div class="net-stage" id="net-stage">
        <canvas class="net-dots" id="net-dots" aria-hidden="true"></canvas>
        <svg class="net-svg" id="net-svg" viewBox="0 0 960 520" aria-hidden="true"></svg>
        <div class="net-layer" id="net-layer" role="group" aria-label="Regional hubs"></div>
        <div class="net-tip glass" id="net-tip" aria-hidden="true"></div>
        <div class="net-peek glass" id="net-peek" aria-hidden="true"></div>
      </div>
      <div class="net-regions" id="net-regions"></div>
      <div class="sr-only" id="net-sr"></div>
</div>
</div>
